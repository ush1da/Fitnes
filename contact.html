<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Запишіться на безкоштовне тренування у FitLife."
    />

    <title>Запис — FitLife</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style3.css" />
  </head>

  <body>
    <header>
      <h1 class="display-4">FitLife Fitness Club</h1>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="catalog.html">Розклад та заняття</a></li>
      </ul>
    </nav>

    <main class="container">
      <h2 class="text-center mb-4">Залиште заявку</h2>
      <!-- фівфівфівфівфівфівфів -->
      <form class="contact-form" id="contact-form">
        <fieldset>
          <legend>Ваші дані для зв'язку</legend>

          <div class="form-group mb-3">
            <label for="name">Ім'я:</label>

            <input
              type="text"
              id="name"
              name="name"
              class="form-control"
              required
              placeholder="Як вас звати?"
            />
          </div>

          <div class="form-group mb-3">
            <label for="email">Електронна пошта:</label>

            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              required
              placeholder="example@mail.com"
            />
          </div>

          <div class="form-group mb-3">
            <label for="phone">Телефон:</label>

            <input
              type="tel"
              id="phone"
              name="phone"
              class="form-control"
              pattern="^\+380\d{9}$"
              placeholder="+380XXXXXXXXX"
              required
            />
          </div>
          <!-- іваіваіваіваіва -->
          <div class="form-group mb-3">
            <label for="training-type">Оберіть тренування:</label>

            <select id="training-type" class="form-control">
              <option>Оберіть тренування</option>
            </select>
          </div>

          <div class="form-group mb-3">
            <label for="message">Ваше повідомлення:</label>

            <textarea
              id="message"
              name="message"
              rows="4"
              class="form-control"
              placeholder="Ваші побажання..."
            ></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-submit">
            Надіслати запит
          </button>
        </fieldset>
      </form>
    </main>

    <footer>
      <p>© 2026 Практична робота №2. Рюмшин Кирило П-31.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
